# Core 1 (inference/radio) Zephyr project configuration.
# Owns BLE and TinyML inference. Must never block/starve Core 0 — see
# ../shared/nvband_ipc_spsc.h and CLAUDE.md §3.6.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y

# TinyML runtime (TensorFlow Lite Micro or a comparable int8 runtime) —
# module/version pinned once models/export/'s target runtime is finalized.
# CONFIG_TFLITE_MICRO=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MBEDTLS=y

CONFIG_DEBUG=y  # see ../core0_safety_signal/prj.conf note on release lockout
