# Core 0 (safety/signal) Zephyr project configuration.
# Real-time, deterministic image: sample clock, safety-chain GPIO reads,
# watchdog kick (CLAUDE.md §1). Nothing here may block on inference/radio.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_I2C=y

# Deterministic scheduling: no cooperative starvation of the sampling
# thread by lower-priority work.
CONFIG_PREEMPT_ENABLED=y
CONFIG_TIMESLICING=n

# Core 0 never touches BLE/radio.
CONFIG_BT=n

# Debug port lockout in release builds — see ../bootloader/README.md and
# firmware/docs/ci_gates.md. This engineering profile intentionally
# leaves debug on; nvband_release.conf (referenced, not yet generated —
# depends on final nRF Connect SDK secure-boot Kconfig surface) overrides
# it for fleet-ota-eligible builds.
CONFIG_DEBUG=y
